# Settings of the game host (README "Settings"). Copy and change; the
# environment overrides these (ASTERISM_GAMES_ROUTER and the rest).
router: tcp/127.0.0.1:7447   # the Zenoh router
node: games                  # this host's node ID
app: games                   # the Asterism application all games live under
# credentials: /path/to/games.tar   # a console's .tar for a router over mutual TLS
state_dir: var/state         # one JSON file per table, written after every change
tables:
  - name: mahjong1
    game: mahjong
    turn_seconds: 5          # a player's time for a move
    bank_seconds: 20         # and a bank the move goes on into, full every round (0: none; README "Time")
    call_seconds: 8          # every player's time to call a discard
    result_seconds: 8        # a table without humans: a round's result stays this long
    result_auto_seconds: 10  # a table with humans: the result moves on this long after its count (or at every human's OK)
    deal_pause_seconds: 2    # a table with humans: the round's name shows this long after the deal
    over_seconds: 60         # the end of a game stays this long (or until the owner's "next")
    away_seconds: 10         # a player not heard from this long is shown as away
    away_wait_seconds: 2     # an away player's time to discard or call (back: the full times)
    cpu_ms: 700              # a CPU's pause before it acts
    cpu_level: normal        # easy / normal / hard (riichi_engine's CPU levels; the owner may choose another)
    # spectator_delay_minutes: 0   # spectators see the game and the hands this much later (README "Spectators")
    humans: 4                # seats players may take
    # rule: riichi_engine's rule keys over the host's defaults (README "Rules"):
    #   game_type: hanchan    # or tonpuu
    #   double_ron: true
    #   triple_ron_draw: false
    #   multiple_yakuman: true
    #   nishi_iri: true
    #   nishi_iri_threshold: 30000
    #   uma: [15000, 5000, -5000, -15000]
  - name: mahjong2
    game: mahjong
  - name: othello1
    game: othello
    turn_seconds: 0          # a player's time for a move (0: none; over 0 the CPU plays a move whose time ran out)
    # cpu_ms: 700            # the CPU's pause before it plays
    # spectators: 14         # members without a seat at most
  - name: board1
    game: board              # the shared drawing board (README "The drawing board")
    # away_seconds: 10       # a member not heard from this long is shown as away
