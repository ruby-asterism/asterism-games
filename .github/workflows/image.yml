# The game host's image, published for each version (GS7): pushing a tag
# v<VERSION> (e.g. v0.12.0, the same number as the VERSION file) builds
# deploy/vps/Dockerfile for amd64 and arm64 and pushes it to the GitHub
# Container Registry as ghcr.io/ruby-asterism/asterism-games:<version>
# (and :<major>.<minor>, :latest). A run by hand (workflow_dispatch) only
# builds, to check that it still does; it pushes nothing.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the VERSION file's number
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but VERSION says ${version}"
            exit 1
          fi
          echo "GAMES_VERSION=${version}" >> "$GITHUB_ENV"

      - name: The version of a run by hand
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "GAMES_VERSION=$(cat VERSION)-dev" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ruby-asterism/asterism-games
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=asterism-games

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vps/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GAMES_VERSION=${{ env.GAMES_VERSION }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
